<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>📝 My Todo List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="stats">
            <div class="stat">
                <span class="stat-label">Total Tasks:</span>
                <span class="stat-value" id="totalTasks">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span class="stat-value" id="completedTasks">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Remaining:</span>
                <span class="stat-value" id="remainingTasks">0</span>
            </div>
        </div>

        <!-- Todo List -->
        <div class="todo-list-container">
            <ul id="todoList" class="todo-list">
                <!-- Todos will be added here -->
            </ul>
            <div id="emptyState" class="empty-state">
                <p>🎉 No tasks yet. Start by adding one!</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="clearCompletedBtn" class="action-btn clear-btn">Clear Completed</button>
            <button id="clearAllBtn" class="action-btn delete-btn">Delete All</button>
            <button id="exportBtn" class="action-btn export-btn">Export</button>
            <button id="importBtn" class="action-btn import-btn">Import</button>
        </div>

        <!-- Hidden Import Input -->
        <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>

    <script src="script.js"></script>
</body>
</html>
